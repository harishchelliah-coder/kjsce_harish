    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;

            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;

            margin-top: 30px;

        .info-card {
            background: #f0f4f8;
            border-left: 4px solid #0056b3;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .info-card h3 {
            margin: 0 0 5px 0;
            color: #0056b3;

        .info-card p {
            margin: 0;
